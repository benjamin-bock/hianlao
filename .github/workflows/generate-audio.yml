# Regenerate the native-voice audio (public/audio/*.mp3 + the manifest) in the
# cloud — no secrets needed, the default provider talks to Microsoft Edge's
# read-aloud endpoint. Run it from the GitHub Actions tab ("Run workflow"),
# review the generated PR, and merge. Use only when audio content changed;
# committing MP3s keeps the site static, free and offline-capable.
name: generate-audio
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet edge-tts
      - run: node scripts/generate-audio.mjs
      - name: Open PR with the generated audio
        run: |
          git config user.name "hianlao-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="audio/batch-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          if git diff --quiet -- public/audio src/data/audio-manifest.ts; then
            echo "No audio changes — nothing to do."
            exit 0
          fi
          git add public/audio src/data/audio-manifest.ts
          git commit -m "chore(audio): regenerate native-voice MP3s"
          git push -u origin "$BRANCH"
          gh pr create --fill --head "$BRANCH" --title "chore(audio): regenerate native-voice MP3s" \
            --body "Generated by the \`generate-audio\` workflow — review a few files and merge."
        env:
          GH_TOKEN: ${{ github.token }}
