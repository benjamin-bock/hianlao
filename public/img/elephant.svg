<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Elephant — the symbol of Laos, land of a million elephants">
  <rect width="400" height="300" fill="#fdf3d8"/>
  <circle cx="70" cy="60" r="26" fill="#ffc800"/>
  <rect y="230" width="400" height="70" fill="#cdeac0"/>
  <g>
    <!-- body -->
    <ellipse cx="210" cy="170" rx="95" ry="62" fill="#9db4d0"/>
    <!-- head -->
    <circle cx="300" cy="140" r="46" fill="#aec3dd"/>
    <!-- ear -->
    <ellipse cx="282" cy="132" rx="24" ry="30" fill="#8fa9c8"/>
    <!-- trunk -->
    <path d="M330 155 Q355 185 340 225 Q332 243 318 238 Q308 234 314 222 Q326 200 312 168 Z" fill="#aec3dd"/>
    <!-- legs -->
    <rect x="150" y="210" width="26" height="45" rx="10" fill="#8fa9c8"/>
    <rect x="195" y="215" width="26" height="42" rx="10" fill="#9db4d0"/>
    <rect x="245" y="212" width="26" height="45" rx="10" fill="#8fa9c8"/>
    <!-- tail -->
    <path d="M118 160 Q100 175 104 195" stroke="#8fa9c8" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- eye + tusk -->
    <circle cx="312" cy="130" r="4.5" fill="#26313f"/>
    <path d="M330 160 Q344 168 346 180 Q336 176 328 168 Z" fill="#fff"/>
    <!-- saddle blanket (lao red) -->
    <rect x="185" y="118" width="60" height="34" rx="8" fill="#ce1126"/>
    <rect x="185" y="118" width="60" height="10" rx="5" fill="#ffc800"/>
  </g>
</svg>
