    <circle cx="265" cy="193" r="4" fill="#ff5252"/>
    <circle cx="300" cy="196" r="4" fill="#ff5252"/>
    <circle cx="285" cy="190" r="3" fill="#fff59d"/>
  </g>
  <!-- chilies -->
  <g stroke="#e53935" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M180 250 Q200 238 218 248"/>
    <path d="M186 262 Q206 252 224 260"/>
  </g>
  <path d="M218 248 l8 -6 M224 260 l8 -5" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
