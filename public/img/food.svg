<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Sticky rice basket and a bowl of larb">
  <rect width="400" height="300" fill="#fff4e0"/>
  <circle cx="345" cy="55" r="24" fill="#ffc800"/>
  <ellipse cx="200" cy="262" rx="170" ry="16" fill="#e8dfc8"/>
  <!-- sticky rice basket (khao niao) -->
  <g>
    <path d="M70 130 L150 130 L138 235 L82 235 Z" fill="#d9a441"/>
    <path d="M70 130 L150 130 L146 158 L74 158 Z" fill="#c68a2e"/>
