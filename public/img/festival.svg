<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Rocket festival (Boun Bang Fai) with fireworks">
  <rect width="400" height="300" fill="#0d1b4c"/>
  <!-- fireworks -->
  <g stroke="#ffc800" stroke-width="3" stroke-linecap="round">
    <path d="M80 60 L80 30 M80 60 L105 45 M80 60 L55 45 M80 60 L108 65 M80 60 L52 65 M80 60 L95 82 M80 60 L65 85"/>
  </g>
  <g stroke="#ff6b81" stroke-width="3" stroke-linecap="round">
    <path d="M320 70 L320 40 M320 70 L345 55 M320 70 L295 55 M320 70 L348 75 M320 70 L292 75"/>
  </g>
  <circle cx="80" cy="60" r="5" fill="#ffc800"/>
  <circle cx="320" cy="70" r="5" fill="#ff6b81"/>
  <!-- stars -->
  <g fill="#fff" opacity=".8">
    <circle cx="150" cy="40" r="2"/><circle cx="210" cy="25" r="1.6"/><circle cx="260" cy="50" r="2"/><circle cx="40" cy="120" r="1.6"/><circle cx="370" cy="130" r="2"/>
  </g>
  <!-- rocket (bang fai) -->
  <g transform="rotate(18 200 190)">
    <path d="M200 90 Q214 130 210 190 L190 190 Q186 130 200 90 Z" fill="#ce1126"/>
    <path d="M200 90 Q208 108 208 128 L192 128 Q192 108 200 90 Z" fill="#ffc800"/>
    <rect x="188" y="188" width="24" height="26" rx="4" fill="#8d6e63"/>
    <path d="M190 214 L200 260 L210 214 Z" fill="#ff9800"/>
    <path d="M194 214 L200 244 L206 214 Z" fill="#ffeb3b"/>
  </g>
  <!-- temple silhouette -->
  <path d="M0 300 L0 250 L40 250 L40 235 L70 235 L70 300 Z" fill="#1a2a6b"/>
  <path d="M20 235 Q55 200 90 235" fill="#1a2a6b"/>
  <rect x="330" y="240" width="70" height="60" fill="#1a2a6b"/>
  <path d="M330 240 Q365 205 400 240" fill="#1a2a6b"/>
</svg>
